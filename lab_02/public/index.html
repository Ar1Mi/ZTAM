<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Powiadomienia</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="196x196" href="icons/favicon-196.png" />
    <link rel="apple-touch-icon" href="icons/apple-icon-180.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="notification.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Notification API</h1>
      <p>Uprawnienie do powiadomień: <strong id="permission">?</strong></p>
      <button id="enable">Włącz powiadomienia</button>
      <button id="local">Powiadomienie ze strony</button>
      <button id="sw">Powiadomienie z service workera</button>

      <h2>Własne powiadomienie</h2>
      <form id="notification-form">
        <label for="title">Tytuł</label>
        <input id="title" name="title" type="text" required maxlength="100" placeholder="np. Przypomnienie" />

        <label for="body">Treść</label>
        <textarea id="body" name="body" rows="3" maxlength="300" placeholder="np. Zajęcia z ZTAM o 10:00"></textarea>

        <label for="icon">Ikona</label>
        <div class="icon-row">
          <select id="icon" name="icon">
            <option value="android.png">Android</option>
            <option value="bell.png">Dzwonek</option>
            <option value="mail.png">Koperta</option>
            <option value="star.png">Gwiazda</option>
          </select>
          <img id="icon-preview" src="android.png" alt="Podgląd ikony" width="48" height="48" />
        </div>

        <button type="submit">Pokaż powiadomienie</button>
      </form>

      <h2>Web Push</h2>
      <button id="subscribe">Subskrybuj powiadomienia push</button>
      <button id="unsubscribe">Anuluj subskrypcję</button>
      <p>
        <label for="subscription">Subskrypcja (skopiuj do pliku lab_02/subscription.json):</label><br />
        <textarea id="subscription" rows="10" cols="60" readonly></textarea>
      </p>
      <button id="copy">Kopiuj subskrypcję</button>
    </main>
  </body>
</html>
